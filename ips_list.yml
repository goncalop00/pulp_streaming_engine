#
# List of IPs and relative branch/commit-hash/tag.
# Uses the YAML syntax.
#
# Dissertation snapshot (2026-06-22): three IPs pinned at the author's forks
# under github.com/goncalop00, the rest at the original pulp-platform tags.
# Anyone cloning this repository and running ./update-ips will obtain the
# exact RTL/firmware tree the dissertation was evaluated on.
#
# Forks:
#   - streaming-engine    (new IP authored for this dissertation)
#   - pulp_cluster        (pulp-platform v2.0.0 + SE integration changes)
#   - riscv               (pulp-platform RI5CY + SE-bench firmware)
#
# Examples:
#
#   or10n:
#     commit: tags/PULP3_final
#     domain: [cluster]
#   udma:
#     commit: 62b10440
#     domain: [soc]
#   axi_slice:
#     commit: master
#     domain: [soc,cluster]
# If a *tag* or *commit* is referenced, the IP will be in a
#  state of DETACHED HEAD. Before committing any additional
#  work, make sure to checkout a branch.
#

pulp_soc:
